plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anarita82.familycalendar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.anarita82.familycalendar'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
